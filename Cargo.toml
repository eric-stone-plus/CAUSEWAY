[package]
name = "causeway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Supervised local egress gateway with health-scored, zero-downtime upstream failover (userspace TCP only)"
license = "Apache-2.0"

[[bin]]
name = "causeway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "signal",
    "process",
    "sync",
    "fs",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
libc = "0.2"
async-trait = "0.1"
ratatui = "0.29.0"
crossterm = "0.28"

[profile.release]
lto = "thin"
